[package]
name = "nodedb-mem"
description = "Global NUMA-aware memory governor preventing subsystem OOM and cache cannibalization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nodedb-mem"
keywords = ["memory", "jemalloc", "arena", "governor", "allocator"]
categories = ["memory-management", "concurrency"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
nodedb-types = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }

# Native-only dev-dependencies. `tokio = { workspace = true }` inherits
# `features = ["full"]`, `fluxbench` declares its own normal
# `tokio = { features = ["full"] }`, and tokio refuses
# fs/io-std/net/process/rt-multi-thread/signal on wasm; Cargo unifies
# dev-dependency features across the whole `cargo test` invocation, so either
# entry breaks every wasm test target in the build. Neither is reachable from a
# wasm test here: this crate has no tokio call sites, no benches and no tokio
# test attribute.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true }
fluxbench = { workspace = true }
