# A sweep, not a per-commit gate: PRs scan only their own commits, the daily
# run scans full history and covers direct pushes to main.

name: Secret scan

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Module path is still zricethezav even though the repo moved orgs.
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git --redact --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: gitleaks git --redact --verbose
